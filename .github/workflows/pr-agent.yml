# PR Agent: a second opinion on every pull request.
#
# The reusable workflow runs PR-Agent against the org's OpenAI-compatible model
# router. The review checklist and the simplification rules live in this
# repository's own .pr_agent.toml, read from the pull request's head branch.
#
# A router outage makes the job wait with exponential backoff and then fail on
# the job timeout, so it never reports success having reviewed nothing. It is
# not a required check.
#
# Permissions are job-scoped and both secrets are passed explicitly (zizmor:
# excessive-permissions, secrets-inherit). No concurrency block on purpose: a
# caller sharing the reusable workflow's exact concurrency group causes an
# opaque 0-job startup_failure.

name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-agent:
    permissions:
      contents: read
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/pr-agent.yml@main
    with:
      improve: true
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
